# 可解锁配方
block.ve-cargo-anchor-recipe-0.description = 补充说明：解锁物流锚点的第1个配方。\n银 5/秒 -> 石墨 5/秒 + 硅 5/秒。

block.ve-cargo-anchor-recipe-1.description = 补充说明：解锁物流锚点的第2个配方。\n银 0.5/秒 -> 镜生体 50/秒。

block.ve-cargo-anchor-recipe-2.description = 补充说明：解锁物流锚点的第3个配方。\n银 5/秒 -> 铁 15/秒。

block.ve-cargo-anchor-recipe-3.description = 补充说明：解锁物流锚点的第4个配方。\n银 1/秒 -> 废料 20/秒。

block.ve-cargo-anchor-recipe-4.description = 补充说明：解锁物流锚点的第5个配方。\n银 5/秒 + 红沙 25/秒 -> 铁 20/秒 + 石英 7.5/秒。

block.ve-cargo-anchor-recipe-5.description = 补充说明：解锁物流锚点的第6个配方。\n银 5/秒 + 红沙 25/秒 -> 铁 20/秒 + 硅 15/秒。

block.ve-cargo-anchor-recipe-6.description = 补充说明：解锁物流锚点的第7个配方。\n铝 20/秒 + 钽 20/秒 + 银 4/秒 -> 空天板甲 20/秒。

block.ve-cargo-anchor-recipe-7.description = 补充说明：解锁物流锚点的第8个配方。\n银 10/秒 + 钽 4/秒 + 硅 8/秒 -> 效应钢 1/秒。
